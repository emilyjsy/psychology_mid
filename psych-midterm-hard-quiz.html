    "id": "H146",
    "chapter": "생물학적 기초",
    "topic": "신경계 기능",
    "stem": "신경계의 역할에 대한 설명으로 가장 적절한 것은?",
    "options": [
      "신체의 운동 부위와 감각기관, 그리고 환경과 신체 사이의 인터페이스 역할을 한다.",
      "오직 장기기억의 의미망만 저장한다.",
      "외부 자극을 모두 동일한 반응으로 바꾼다.",
      "학습된 무기력을 방지하기 위한 강화계획이다.",
      "감각기관과 무관하게 순수한 논리추론만 수행한다."
    ],
    "answer": 0,
    "explanation": "신경계는 감각 입력, 운동 출력, 내부 조절을 연결하는 신체-환경 인터페이스로 이해할 수 있다.",
    "point": "신경계는 ‘뇌만’이 아니라 몸과 환경 사이의 연결 체계다.",
    "difficulty": "상"
  }
];
const LABELS = ["①","②","③","④","⑤"];
const LETTERS = ["a","b","c","d","e"];
const WRONG_KEY = "psych_midterm_hard_wrong_v1";
let current = [...QUESTIONS];
let answered = new Map();
let timerInterval = null;
let secondsLeft = null;

function getWrongs(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||"[]")}catch(e){return []}}
function setWrongs(arr){localStorage.setItem(WRONG_KEY, JSON.stringify([...new Set(arr)])); updateStats();}
function addWrong(id){const w=getWrongs(); if(!w.includes(id)) w.push(id); setWrongs(w)}
function removeWrong(id){setWrongs(getWrongs().filter(x=>x!==id))}
function shuffle(arr){const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a}
function sample(arr,n){return shuffle(arr).slice(0,Math.min(n,arr.length))}
function chapters(){return [...new Set(QUESTIONS.map(q=>q.chapter))]}
function setup(){
  document.getElementById('totalCount').textContent = QUESTIONS.length;
  const sel=document.getElementById('chapterSelect');
  chapters().forEach(ch=>{const o=document.createElement('option'); o.value=ch; o.textContent=ch; sel.appendChild(o)});
  const cb=document.getElementById('chapterButtons');
  chapters().forEach(ch=>{const b=document.createElement('button'); b.textContent=ch; b.onclick=()=>loadChapter(ch); cb.appendChild(b)});
  loadAll();
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval); timerInterval=null;} secondsLeft=null; document.getElementById('timer').textContent='--:--'}
function startTimer(minutes){stopTimer(); secondsLeft=minutes*60; tick(); timerInterval=setInterval(tick,1000)}
function tick(){
  if(secondsLeft===null) return;
  const m=Math.floor(secondsLeft/60), s=secondsLeft%60;
  document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(secondsLeft<=0){clearInterval(timerInterval); timerInterval=null; alert('시간 종료! 이제 맞힌/틀린 문항을 확인하세요.'); return;}
  secondsLeft--;
}
function setCurrent(arr,label, timer=false){
  current=[...arr]; answered = new Map(); document.getElementById('setLabel').textContent=label; document.getElementById('searchBox').value='';
  if(timer) startTimer(40); else stopTimer();
  render();
}
function loadAll(){setCurrent(QUESTIONS,'전체')}
function loadChapter(ch){if(!ch) return; document.getElementById('chapterSelect').value=ch; setCurrent(QUESTIONS.filter(q=>q.chapter===ch), ch)}
function loadRandom(n){setCurrent(sample(QUESTIONS,n),'랜덤 '+n)}
function loadExam(){
  const plan = {"기억":7,"감각·지각":7,"사고":7,"학습":7,"생물학적 기초":7,"개관·역사·방법":5};
  let chosen=[];
  Object.entries(plan).forEach(([ch,n])=>{chosen=chosen.concat(sample(QUESTIONS.filter(q=>q.chapter===ch),n))});
  setCurrent(shuffle(chosen),'실전 40문항', true);
}
function loadWrong(){
  const ids=getWrongs(); const arr=QUESTIONS.filter(q=>ids.includes(q.id));
  setCurrent(arr,'오답노트');
}
function clearWrong(){if(confirm('오답노트를 모두 지울까요?')){setWrongs([]); if(document.getElementById('setLabel').textContent==='오답노트') loadWrong();}}
function searchQuestions(){
  const term=document.getElementById('searchBox').value.trim().toLowerCase();
  if(!term){render(); return;}
  const filtered=current.filter(q => (q.chapter+' '+q.topic+' '+q.stem+' '+q.options.join(' ')+' '+q.explanation).toLowerCase().includes(term));
  render(filtered);
}
function norm(v){
  if(v===undefined || v===null) return null;
  let x=String(v).trim().toLowerCase();
  const circ={"①":0,"②":1,"③":2,"④":3,"⑤":4,"㉠":0,"㉡":1,"㉢":2,"㉣":3,"㉤":4};
  if(x in circ) return circ[x];
  if(["ㄱ","가"].includes(x)) return 0; if(["ㄴ","나"].includes(x)) return 1; if(["ㄷ","다"].includes(x)) return 2; if(["ㄹ","라"].includes(x)) return 3; if(["ㅁ","마"].includes(x)) return 4;
  if(LETTERS.includes(x)) return LETTERS.indexOf(x);
  const n=parseInt(x,10); if(!isNaN(n) && n>=1 && n<=5) return n-1;
  return null;
}
function render(arr=current){
  const root=document.getElementById('quiz'); root.innerHTML='';
  if(arr.length===0){root.innerHTML='<div class="empty">표시할 문항이 없습니다.</div>'; updateStats(arr.length); return;}
  arr.forEach((q,i)=>root.appendChild(card(q,i+1)));
  updateStats(arr.length);
}
function card(q, idx){
  const div=document.createElement('section'); div.className='card'; div.id='card-'+q.id;
  const meta=document.createElement('div'); meta.className='meta';
  meta.innerHTML=`<span class="tag">${q.id}</span><span class="tag">${escapeHtml(q.chapter)}</span><span class="tag">${escapeHtml(q.topic)}</span><span class="tag hard">난이도 ${q.difficulty}</span>`;
  const title=document.createElement('div'); title.className='qtitle'; title.innerHTML=`${idx}. ${escapeHtml(q.stem)}`;
  const opts=document.createElement('div'); opts.className='opts';
  q.options.forEach((op,j)=>{
    const b=document.createElement('button'); b.className='opt'; b.onclick=()=>check(q.id,j);
    b.innerHTML=`<span class="num">${LABELS[j]}</span><span>${escapeHtml(op)}</span>`; opts.appendChild(b);
  });
  const ans=document.createElement('div'); ans.className='answerRow';
  ans.innerHTML=`<input id="input-${q.id}" placeholder="정답 입력" onkeydown="if(event.key==='Enter') check('${q.id}', this.value)"><button class="small" onclick="check('${q.id}', document.getElementById('input-${q.id}').value)">채점</button><button class="small ghost" onclick="showAnswer('${q.id}')">정답 보기</button>`;
  const fb=document.createElement('div'); fb.className='feedback neutral'; fb.id='fb-'+q.id; fb.textContent='아직 채점하지 않았습니다.';
  div.append(meta,title,opts,ans,fb);
  return div;
}
function check(id, value){
  const q=QUESTIONS.find(x=>x.id===id); const selected=norm(value);
  const fb=document.getElementById('fb-'+id); const card=document.getElementById('card-'+id);
  card.querySelectorAll('.opt').forEach((el,j)=>{el.classList.remove('correct','wrong'); if(j===q.answer) el.classList.add('correct');});
  if(selected===null || selected>=q.options.length){fb.className='feedback bad'; fb.innerHTML='입력을 인식하지 못했습니다. 1~5, a~e, ①~⑤ 중 하나로 입력하세요.'; return;}
  const ok=selected===q.answer; answered.set(id, ok); if(ok) removeWrong(id); else addWrong(id);
  const selectedEl=card.querySelectorAll('.opt')[selected]; if(!ok && selectedEl) selectedEl.classList.add('wrong');
  fb.className='feedback '+(ok?'ok':'bad');
  fb.innerHTML = `<b>${ok?'정답':'오답'}</b> · 선택 ${LABELS[selected]} / 정답 ${LABELS[q.answer]}<div class="explain">${escapeHtml(q.explanation)}</div><div class="point">기출 포인트: ${escapeHtml(q.point)}</div>`;
  updateStats();
}
function showAnswer(id){
  const q=QUESTIONS.find(x=>x.id===id); const fb=document.getElementById('fb-'+id); const card=document.getElementById('card-'+id);
  card.querySelectorAll('.opt').forEach((el,j)=>{el.classList.toggle('correct',j===q.answer); el.classList.remove('wrong')});
  fb.className='feedback neutral';
  fb.innerHTML=`<b>정답 ${LABELS[q.answer]}</b><div class="explain">${escapeHtml(q.explanation)}</div><div class="point">기출 포인트: ${escapeHtml(q.point)}</div>`;
}
function updateStats(visible=current.length){
  const totalVisible = typeof visible==='number' ? visible : current.length;
  document.getElementById('visibleCount').textContent=totalVisible;
  document.getElementById('answeredCount').textContent=answered.size;
  let correct=0; answered.forEach(v=>{if(v) correct++});
  document.getElementById('accuracy').textContent=answered.size? Math.round(correct/answered.size*100)+'%':'-';
  document.getElementById('wrongCount').textContent=getWrongs().length;
  const pct=totalVisible? Math.min(100, answered.size/totalVisible*100):0;
  document.getElementById('bar').style.width=pct+'%';
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
setup();
</script>
</body>
</html>
