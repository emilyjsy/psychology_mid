<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심리학개론 퀴즈 센터</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #3b82f6;
      --accent-secondary: #6366f1;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top right, #eff6ff 0%, var(--bg) 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    header {
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      text-align: left;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card.primary::before { background: var(--accent-primary); }
    .card.hard::before { background: var(--accent-secondary); }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border-color: transparent;
    }

    .card:hover::before {
      opacity: 1;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 16px;
      width: fit-content;
    }

    .card.primary .badge {
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    .card.hard .badge {
      background-color: #eef2ff;
      color: #4338ca;
    }

    .card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .go-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-top: auto;
      transition: color 0.2s ease;
    }

    .card.primary:hover .go-btn { color: var(--accent-primary); }
    .card.hard:hover .go-btn { color: var(--accent-secondary); }

    .go-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .card:hover .go-btn svg {
      transform: translateX(4px);
    }

    footer {
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>심리학개론 퀴즈 센터</h1>
      <p>중간고사 대비 객관식 및 고난도 기출변형 문제를 풀어보세요.</p>
    </header>

    <div class="grid">
      <a href="./psych-midterm-quiz.html" class="card primary">
        <div>
          <span class="badge">기본~중급</span>
          <h2>중간 대비 객관식 퀴즈</h2>
          <p>단원별 핵심 개념을 점검하고 오답노트 기능을 활용해 취약한 파트를 복습할 수 있습니다.</p>
        </div>
        <div class="go-btn">
          퀴즈 풀러 가기
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
      </a>

      <a href="./psych-midterm-hard-quiz.html" class="card hard">
        <div>
          <span class="badge">심화/고난도</span>
          <h2>고난도 기출변형 퀴즈</h2>
          <p>실제 시험 난이도에 맞춘 꼬아 낸 보기들과 디테일한 기출 포인트 해설이 포함된 심화 퀴즈입니다.</p>
        </div>
        <div class="go-btn">
          도전하러 가기
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
      </a>
    </div>

    <footer>
      &copy; 2026 심리학개론 학습 페이지. All rights reserved.
    </footer>
  </div>

</body>
</html>
